version: '3.8'

services:
  backend:
    image: ghcr.io/pdytokyo/sns-ai-agent-backend:${TAG:-latest}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/sns_ai_saas.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - IG_COOKIE_FILE=${IG_COOKIE_FILE:-./data/ig_cookies.txt}
    restart: unless-stopped

  admin:
    image: ghcr.io/pdytokyo/sns-ai-agent-admin:${TAG:-latest}
    ports:
      - "8501:8501"
    volumes:
      - backend_data:/app/data
    environment:
      - API_URL=http://backend:8000
      - DATABASE_URL=sqlite:///./data/sns_ai_saas.db
    depends_on:
      - backend
    restart: unless-stopped
    
  discordbot:
    image: ghcr.io/pdytokyo/sns-ai-agent-discordbot:${TAG:-latest}
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:

# default tag fallback
services: {}  # ←ダミー行
