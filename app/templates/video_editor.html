<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画編集 - Instagram AI Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .video-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .video-player {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
        }
        
        .subtitle-item {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }
        
        .timeline-container {
            width: 100%;
            height: 80px;
            background-color: #f0f0f0;
            border-radius: 5px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Instagram AI Agent</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/client-workflow">クライアントワークフロー</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">ダッシュボード</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/script-editor">スクリプト編集</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/video-editor">動画編集</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>動画編集</h1>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        クライアント選択
                    </div>
                    <div class="card-body">
                        <select id="clientSelect" class="form-select mb-3">
                            <option value="">クライアントを選択してください</option>
                            <!-- クライアントリストがJSで挿入されます -->
                        </select>
                        
                        <button id="loadVideosBtn" class="btn btn-primary" disabled>動画読み込み</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        新規動画アップロード
                    </div>
                    <div class="card-body">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="videoFile" class="form-label">動画ファイル</label>
                                <input type="file" class="form-control" id="videoFile" name="file" accept="video/*">
                            </div>
                            
                            <div class="mb-3">
                                <label for="aspectRatio" class="form-label">アスペクト比</label>
                                <select id="aspectRatio" name="aspect_ratio" class="form-select">
                                    <option value="9:16">9:16 (Instagram リール)</option>
                                    <option value="16:9">16:9 (横向き)</option>
                                    <option value="1:1">1:1 (正方形)</option>
                                    <option value="4:5">4:5 (Instagram フィード)</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="marginSeconds" class="form-label">マージン秒数</label>
                                <input type="number" class="form-control" id="marginSeconds" name="margin_seconds" value="0.5" min="0" max="5" step="0.1">
                                <div class="form-text">ジェットカットの際に残す無音部分の秒数</div>
                            </div>
                            
                            <input type="hidden" id="uploadClientId" name="client_id">
                            <button type="submit" class="btn btn-success" id="uploadBtn" disabled>アップロード</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="loadingSpinner" class="text-center my-5 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">読み込み中...</span>
            </div>
            <p class="mt-2">処理中です。しばらくお待ちください...</p>
        </div>
        
        <div id="videoEditorContainer" class="mt-4 d-none">
            <!-- 動画編集UI -->
        </div>
        
        <div id="videosListContainer" class="mt-4">
            <!-- 動画リストがJSで挿入されます -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript実装は省略
    </script>
</body>
</html>
