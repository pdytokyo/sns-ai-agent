<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクリプト編集 - Instagram AI Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .script-container {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        
        .script-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        
        .script-content {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        
        .key-points {
            background-color: #f0f0f0;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .key-points ul {
            margin-bottom: 0;
        }
        
        .char-count {
            font-size: 0.9rem;
            color: #666;
            text-align: right;
        }
        
        .char-count.warning {
            color: #f57c00;
        }
        
        .char-count.error {
            color: #d32f2f;
        }
        
        .script-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .template-badge {
            background-color: #4caf50;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Instagram AI Agent</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/client-workflow">クライアントワークフロー</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">ダッシュボード</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/script-editor">スクリプト編集</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/video-editor">動画編集</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>スクリプト編集</h1>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        クライアント選択
                    </div>
                    <div class="card-body">
                        <select id="clientSelect" class="form-select mb-3">
                            <option value="">クライアントを選択してください</option>
                            <!-- クライアントリストがJSで挿入されます -->
                        </select>
                        
                        <button id="loadScriptsBtn" class="btn btn-primary" disabled>スクリプト読み込み</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        新規スクリプト生成
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="numProposals" class="form-label">提案数</label>
                            <select id="numProposals" class="form-select">
                                <option value="3">3</option>
                                <option value="5">5</option>
                                <option value="7">7</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="additionalInstructions" class="form-label">追加指示</label>
                            <textarea id="additionalInstructions" class="form-control" rows="3" placeholder="特別な要望や指示があれば入力してください"></textarea>
                        </div>
                        
                        <button id="generateScriptsBtn" class="btn btn-success" disabled>新規スクリプト生成</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="loadingSpinner" class="text-center my-5 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">読み込み中...</span>
            </div>
            <p class="mt-2">処理中です。しばらくお待ちください...</p>
        </div>
        
        <div id="scriptsContainer" class="mt-4">
            <!-- スクリプトがJSで挿入されます -->
        </div>
        
        <!-- スクリプト編集モーダル -->
        <div class="modal fade" id="editScriptModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">スクリプト編集</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editScriptId">
                        
                        <div class="mb-3">
                            <label for="editScriptTitle" class="form-label">タイトル</label>
                            <input type="text" class="form-control" id="editScriptTitle">
                        </div>
                        
                        <div class="mb-3">
                            <label for="editScriptContent" class="form-label">スクリプト内容</label>
                            <textarea class="form-control" id="editScriptContent" rows="10"></textarea>
                            <div id="editCharCount" class="char-count mt-1">0文字</div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">キーポイント</label>
                            <div id="keyPointsContainer">
                                <!-- キーポイントがJSで挿入されます -->
                            </div>
                            <button id="addKeyPointBtn" class="btn btn-sm btn-outline-secondary mt-2">
                                <i class="bi bi-plus"></i> キーポイント追加
                            </button>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="saveAsTemplate">
                            <label class="form-check-label" for="saveAsTemplate">
                                テンプレートとして保存
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                        <button type="button" class="btn btn-primary" id="saveScriptBtn">保存</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 撮影指示書生成モーダル -->
        <div class="modal fade" id="shootingInstructionsModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">撮影指示書</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="shootingInstructionsContent" class="p-3 bg-light rounded">
                            <!-- 撮影指示書がJSで挿入されます -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                        <button type="button" class="btn btn-primary" id="downloadInstructionsBtn">ダウンロード</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM要素
            const clientSelect = document.getElementById('clientSelect');
            const loadScriptsBtn = document.getElementById('loadScriptsBtn');
            const generateScriptsBtn = document.getElementById('generateScriptsBtn');
            const numProposals = document.getElementById('numProposals');
            const additionalInstructions = document.getElementById('additionalInstructions');
            const scriptsContainer = document.getElementById('scriptsContainer');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            // 編集モーダル要素
            const editScriptModal = new bootstrap.Modal(document.getElementById('editScriptModal'));
            const editScriptId = document.getElementById('editScriptId');
            const editScriptTitle = document.getElementById('editScriptTitle');
            const editScriptContent = document.getElementById('editScriptContent');
            const editCharCount = document.getElementById('editCharCount');
            const keyPointsContainer = document.getElementById('keyPointsContainer');
            const addKeyPointBtn = document.getElementById('addKeyPointBtn');
            const saveAsTemplate = document.getElementById('saveAsTemplate');
            const saveScriptBtn = document.getElementById('saveScriptBtn');
            
            // 撮影指示書モーダル要素
            const shootingInstructionsModal = new bootstrap.Modal(document.getElementById('shootingInstructionsModal'));
            const shootingInstructionsContent = document.getElementById('shootingInstructionsContent');
            const downloadInstructionsBtn = document.getElementById('downloadInstructionsBtn');
            
            // クライアントリストの読み込み
            fetch('/api/clients')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        data.clients.forEach(client => {
                            const option = document.createElement('option');
                            option.value = client.id;
                            option.textContent = `${client.name} (${client.industry})`;
                            clientSelect.appendChild(option);
                        });
                    }
                })
                .catch(error => console.error('クライアント読み込みエラー:', error));
            
            // クライアント選択時の処理
            clientSelect.addEventListener('change', function() {
                loadScriptsBtn.disabled = !this.value;
                generateScriptsBtn.disabled = !this.value;
            });
            
            // スクリプト読み込みボタンのイベント
            loadScriptsBtn.addEventListener('click', function() {
                const clientId = clientSelect.value;
                if (!clientId) return;
                
                loadingSpinner.classList.remove('d-none');
                scriptsContainer.innerHTML = '';
                
                fetch(`/api/script-proposals?client_id=${clientId}`)
                    .then(response => response.json())
                    .then(data => {
                        loadingSpinner.classList.add('d-none');
                        
                        if (data.success && data.proposals.length > 0) {
                            renderScripts(data.proposals, clientId);
                        } else {
                            scriptsContainer.innerHTML = `
                                <div class="alert alert-info">
                                    このクライアントのスクリプト提案はまだありません。
                                    「新規スクリプト生成」から作成してください。
                                </div>
                            `;
                        }
                    })
                    .catch(error => {
                        loadingSpinner.classList.add('d-none');
                        console.error('スクリプト読み込みエラー:', error);
                        scriptsContainer.innerHTML = `
                            <div class="alert alert-danger">
                                スクリプトの読み込み中にエラーが発生しました。
                            </div>
                        `;
                    });
            });
            
            // 新規スクリプト生成ボタンのイベント
            generateScriptsBtn.addEventListener('click', function() {
                const clientId = clientSelect.value;
                if (!clientId) return;
                
                loadingSpinner.classList.remove('d-none');
                scriptsContainer.innerHTML = '';
                
                fetch('/api/generate-script-proposals', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        client_id: parseInt(clientId),
                        num_proposals: parseInt(numProposals.value),
                        additional_instructions: additionalInstructions.value
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        loadingSpinner.classList.add('d-none');
                        
                        if (data.success) {
                            renderScripts(data.proposals, clientId);
                        } else {
                            scriptsContainer.innerHTML = `
                                <div class="alert alert-danger">
                                    スクリプト生成中にエラーが発生しました: ${data.error || '不明なエラー'}
                                </div>
                            `;
                        }
                    })
                    .catch(error => {
                        loadingSpinner.classList.add('d-none');
                        console.error('スクリプト生成エラー:', error);
                        scriptsContainer.innerHTML = `
                            <div class="alert alert-danger">
                                スクリプト生成中にエラーが発生しました。
                            </div>
                        `;
                    });
            });
            
            // スクリプトの表示
            function renderScripts(proposals, clientId) {
                scriptsContainer.innerHTML = '';
                
                proposals.forEach(proposal => {
                    const scriptElement = document.createElement('div');
                    scriptElement.className = 'script-container';
                    scriptElement.dataset.id = proposal.id;
                    
                    const keyPointsHtml = proposal.key_points.map(point => `<li>${point}</li>`).join('');
                    
                    scriptElement.innerHTML = `
                        <div class="script-title">
                            ${proposal.title}
                            ${proposal.is_template ? '<span class="template-badge">テンプレート</span>' : ''}
                        </div>
                        <div class="script-content">${proposal.content}</div>
                        <div class="key-points">
                            <strong>キーポイント:</strong>
                            <ul>${keyPointsHtml}</ul>
                        </div>
                        <div class="char-count ${getCharCountClass(proposal.char_count)}">
                            文字数: ${proposal.char_count}
                        </div>
                        <div class="script-actions">
                            <div>
                                <button class="btn btn-sm btn-outline-primary edit-script-btn" data-id="${proposal.id}">
                                    編集
                                </button>
                                <button class="btn btn-sm btn-outline-success select-script-btn" data-id="${proposal.id}" data-client-id="${clientId}">
                                    選択
                                </button>
                            </div>
                            <button class="btn btn-sm btn-outline-info shooting-instructions-btn" data-id="${proposal.id}" data-client-id="${clientId}">
                                撮影指示書
                            </button>
                        </div>
                    `;
                    
                    scriptsContainer.appendChild(scriptElement);
                });
                
                // 編集ボタンのイベント設定
                document.querySelectorAll('.edit-script-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const proposalId = this.dataset.id;
                        openEditModal(proposalId);
                    });
                });
                
                // 選択ボタンのイベント設定
                document.querySelectorAll('.select-script-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const proposalId = this.dataset.id;
                        const clientId = this.dataset.clientId;
                        selectScript(proposalId, clientId);
                    });
                });
                
                // 撮影指示書ボタンのイベント設定
                document.querySelectorAll('.shooting-instructions-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const proposalId = this.dataset.id;
                        const clientId = this.dataset.clientId;
                        generateShootingInstructions(proposalId, clientId);
                    });
                });
            }
            
            // 文字数に応じたクラスを取得
            function getCharCountClass(count) {
                if (count > 500) return 'error';
                if (count > 400) return 'warning';
                return '';
            }
            
            // 編集モーダルを開く
            function openEditModal(proposalId) {
                fetch(`/api/script-proposals/${proposalId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            const proposal = data.proposal;
                            
                            editScriptId.value = proposal.id;
                            editScriptTitle.value = proposal.title;
                            editScriptContent.value = proposal.content;
                            updateCharCount(proposal.content);
                            
                            // キーポイントの表示
                            keyPointsContainer.innerHTML = '';
                            proposal.key_points.forEach((point, index) => {
                                addKeyPointInput(point);
                            });
                            
                            saveAsTemplate.checked = proposal.is_template;
                            
                            editScriptModal.show();
                        }
                    })
                    .catch(error => console.error('スクリプト取得エラー:', error));
            }
            
            // キーポイント入力欄の追加
            function addKeyPointInput(value = '') {
                const keyPointDiv = document.createElement('div');
                keyPointDiv.className = 'input-group mb-2';
                keyPointDiv.innerHTML = `
                    <input type="text" class="form-control key-point-input" value="${value}">
                    <button class="btn btn-outline-danger remove-key-point-btn" type="button">
                        <i class="bi bi-trash"></i>
                    </button>
                `;
                
                keyPointsContainer.appendChild(keyPointDiv);
                
                // 削除ボタンのイベント
                keyPointDiv.querySelector('.remove-key-point-btn').addEventListener('click', function() {
                    keyPointDiv.remove();
                });
            }
            
            // キーポイント追加ボタンのイベント
            addKeyPointBtn.addEventListener('click', function() {
                addKeyPointInput();
            });
            
            // 文字数カウントの更新
            function updateCharCount(text) {
                const count = text.length;
                editCharCount.textContent = `${count}文字`;
                
                editCharCount.className = 'char-count mt-1 ' + getCharCountClass(count);
            }
            
            // 文字数カウントのイベント
            editScriptContent.addEventListener('input', function() {
                updateCharCount(this.value);
            });
            
            // スクリプト保存ボタンのイベント
            saveScriptBtn.addEventListener('click', function() {
                const proposalId = editScriptId.value;
                const title = editScriptTitle.value;
                const content = editScriptContent.value;
                const keyPoints = Array.from(document.querySelectorAll('.key-point-input')).map(input => input.value).filter(value => value.trim());
                const isTemplate = saveAsTemplate.checked;
                
                fetch(`/api/script-proposals/${proposalId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title,
                        content,
                        key_points: keyPoints,
                        is_template: isTemplate
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            editScriptModal.hide();
                            
                            // スクリプトリストの更新
                            const clientId = clientSelect.value;
                            loadScriptsBtn.click();
                        }
                    })
                    .catch(error => console.error('スクリプト保存エラー:', error));
            });
            
            // スクリプト選択
            function selectScript(proposalId, clientId) {
                fetch('/api/select-script', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        proposal_id: parseInt(proposalId),
                        client_id: parseInt(clientId)
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // 選択状態の更新
                            document.querySelectorAll('.script-container').forEach(container => {
                                container.classList.remove('border-success');
                                container.classList.remove('border-3');
                            });
                            
                            const selectedContainer = document.querySelector(`.script-container[data-id="${proposalId}"]`);
                            if (selectedContainer) {
                                selectedContainer.classList.add('border-success');
                                selectedContainer.classList.add('border-3');
                            }
                            
                            alert('スクリプトが選択されました。');
                        }
                    })
                    .catch(error => console.error('スクリプト選択エラー:', error));
            }
            
            // 撮影指示書の生成
            function generateShootingInstructions(proposalId, clientId) {
                loadingSpinner.classList.remove('d-none');
                
                fetch('/api/generate-shooting-instructions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        proposal_id: parseInt(proposalId),
                        client_id: parseInt(clientId)
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        loadingSpinner.classList.add('d-none');
                        
                        if (data.success) {
                            shootingInstructionsContent.innerHTML = `<pre>${data.instructions}</pre>`;
                            shootingInstructionsModal.show();
                        } else {
                            alert(`撮影指示書の生成中にエラーが発生しました: ${data.error || '不明なエラー'}`);
                        }
                    })
                    .catch(error => {
                        loadingSpinner.classList.add('d-none');
                        console.error('撮影指示書生成エラー:', error);
                        alert('撮影指示書の生成中にエラーが発生しました。');
                    });
            }
            
            // 撮影指示書のダウンロード
            downloadInstructionsBtn.addEventListener('click', function() {
                const content = shootingInstructionsContent.textContent;
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = '撮影指示書.txt';
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 0);
            });
        });
    </script>
</body>
</html>
