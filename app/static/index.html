<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=client_workflow.html">
    <title>SNS AIエージェント - リダイレクト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding-top: 50px;
        }
        .redirect-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h2>新しいワークフローに移動しています</h2>
        <p>自動的に新しいページにリダイレクトします。リダイレクトされない場合は<a href="client_workflow.html">こちら</a>をクリックしてください。</p>
    </div>
</body>

    <script>
        // クライアントIDを保存する変数
        let clientId = null;
        
        // クライアント情報フォームの送信
        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('clientName').value;
            const email = document.getElementById('clientEmail').value;
            const youtubeUrls = document.getElementById('youtubeUrls').value.split('\n').filter(url => url.trim() !== '');
            
            fetch('/clients/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    youtube_urls: youtubeUrls
                }),
            })
            .then(response => response.json())
            .then(data => {
                clientId = data.id;
                alert('クライアント情報が保存されました。');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // ターゲット・目的・プラットフォーム選択フォームの送信
        document.getElementById('selectionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const targetAttributes = Array.from(document.querySelectorAll('.target-attr:checked')).map(cb => cb.value);
            const operationalPurposes = Array.from(document.querySelectorAll('.purpose:checked')).map(cb => cb.value);
            const platforms = Array.from(document.querySelectorAll('.platform:checked')).map(cb => cb.value);
            
            fetch('/selections/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    client_id: clientId,
                    target_attributes: targetAttributes,
                    operational_purposes: operationalPurposes,
                    platforms: platforms
                }),
            })
            .then(response => response.json())
            .then(data => {
                alert('選択情報が保存されました。');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // ファイルアップロードフォームの送信
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const formData = new FormData();
            formData.append('client_id', clientId);
            
            const videoFile = document.getElementById('videoFile').files[0];
            const textFile = document.getElementById('textFile').files[0];
            const pdfFile = document.getElementById('pdfFile').files[0];
            
            if (videoFile) formData.append('video_file', videoFile);
            if (textFile) formData.append('text_file', textFile);
            if (pdfFile) formData.append('pdf_file', pdfFile);
            
            fetch('/upload/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                alert('ファイルがアップロードされました。');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // プロフィール生成ボタンのクリック
        document.getElementById('generateProfileBtn').addEventListener('click', function() {
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const formData = new FormData();
            formData.append('client_id', clientId);
            
            fetch('/generate-profile/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                const content = `
                <div class="card mb-3">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">生成されたプロフィール</h5>
                    </div>
                    <div class="card-body">
                        <h6>アカウント名</h6>
                        <p>${data.account_name}</p>
                        <h6>プロフィール文</h6>
                        <p>${data.profile_text}</p>
                    </div>
                </div>
                `;
                
                document.getElementById('generatedContent').innerHTML = content;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // 台本生成ボタンのクリック
        document.getElementById('generateScriptBtn').addEventListener('click', function() {
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const formData = new FormData();
            formData.append('client_id', clientId);
            
            fetch('/generate-script/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                const content = `
                <div class="card mb-3">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">生成された台本</h5>
                    </div>
                    <div class="card-body">
                        <pre>${data.script_text}</pre>
                    </div>
                </div>
                `;
                
                document.getElementById('generatedContent').innerHTML = content;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // BGM検索ボタンのクリック
        document.getElementById('searchAudioBtn').addEventListener('click', function() {
            const genre = document.getElementById('audioGenre').value;
            const mood = document.getElementById('audioMood').value;
            
            fetch(`/copyright-free-audio/?genre=${genre}&mood=${mood}`)
            .then(response => response.json())
            .then(data => {
                let content = '';
                
                if (data.length === 0) {
                    content = '<div class="alert alert-warning">該当するBGMが見つかりませんでした。</div>';
                } else {
                    content = '<div class="list-group">';
                    data.forEach(audio => {
                        content += `
                        <div class="list-group-item">
                            <h6>${audio.title}</h6>
                            <p>ジャンル: ${audio.genre} | ムード: ${audio.mood} | 長さ: ${audio.duration}秒</p>
                            <audio controls src="/audio/${audio.id}" class="w-100"></audio>
                        </div>
                        `;
                    });
                    content += '</div>';
                }
                
                document.getElementById('audioList').innerHTML = content;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // スライダーの値表示更新
        document.getElementById('silenceThreshold').addEventListener('input', function() {
            document.getElementById('silenceThresholdValue').textContent = this.value;
        });
        
        document.getElementById('startMargin').addEventListener('input', function() {
            document.getElementById('startMarginValue').textContent = this.value;
        });
        
        document.getElementById('endMargin').addEventListener('input', function() {
            document.getElementById('endMarginValue').textContent = this.value;
        });
        
        // 動画処理ボタンのクリック
        document.getElementById('processVideoBtn').addEventListener('click', function() {
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const videoId = document.getElementById('videoSelect').value;
            if (!videoId) {
                alert('動画を選択してください。');
                return;
            }
            
            const aspectRatio = document.querySelector('input[name="aspectRatio"]:checked').value;
            const silenceThreshold = document.getElementById('silenceThreshold').value;
            const startMargin = document.getElementById('startMargin').value;
            const endMargin = document.getElementById('endMargin').value;
            
            const formData = new FormData();
            formData.append('client_id', clientId);
            formData.append('file_id', videoId);
            formData.append('aspect_ratio', aspectRatio);
            formData.append('silence_threshold', silenceThreshold);
            formData.append('start_margin', startMargin);
            formData.append('end_margin', endMargin);
            
            fetch('/process-video/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                alert(`動画処理が完了しました。\n元の長さ: ${data.original_duration}秒\n処理後の長さ: ${data.processed_duration}秒\n削減率: ${data.reduction_percentage}%`);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
    </script>
</body>
</html>
