<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声編集アシスタント</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/edit/voice-edit.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">音声編集アシスタント</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>ステップ 1: 動画を選択</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="videoSelect" class="form-label">編集する動画を選択</label>
                    <select class="form-select" id="videoSelect">
                        <option value="">動画を選択してください</option>
                        <!-- 動画リストはJavaScriptで動的に生成 -->
                    </select>
                </div>
                <div class="mb-3">
                    <label for="videoUpload" class="form-label">または新しい動画をアップロード (.mp4形式、500MB以下)</label>
                    <input type="file" class="form-control" id="videoUpload" accept="video/mp4">
                </div>
                <div id="videoPreviewContainer" class="mt-3 d-none">
                    <h6>プレビュー:</h6>
                    <video id="videoPreview" controls class="img-fluid"></video>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>ステップ 2: 音声で編集指示</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="d-grid gap-2">
                            <button id="startRecording" class="btn btn-primary">録音開始</button>
                            <button id="stopRecording" class="btn btn-danger" disabled>録音停止</button>
                        </div>
                        <div class="mt-3">
                            <div id="recordingStatus" class="alert alert-info d-none">録音中...</div>
                            <div id="recordingTime" class="text-center fs-4 d-none">00:00</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="textInput" class="form-label">または直接テキストで指示</label>
                            <textarea class="form-control" id="textInput" rows="3" placeholder="例: 最初の5秒をカットして、10秒から15秒の間に「見てください！」というテロップを入れて"></textarea>
                        </div>
                        <div class="d-grid">
                            <button id="submitText" class="btn btn-success">テキスト送信</button>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <div id="transcriptionResult" class="alert alert-light d-none"></div>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>ステップ 3: 編集提案</h5>
            </div>
            <div class="card-body">
                <div id="editProposalContainer" class="d-none">
                    <h6>提案された編集内容:</h6>
                    <div id="editProposal" class="border p-3 mb-3 bg-light"></div>
                    <div class="d-grid gap-2">
                        <button id="applyEdits" class="btn btn-primary">編集を適用</button>
                        <button id="rejectEdits" class="btn btn-outline-secondary">やり直す</button>
                    </div>
                </div>
                <div id="noProposalMessage" class="alert alert-info">
                    音声またはテキストで編集指示を入力してください。
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>ステップ 4: 編集結果</h5>
            </div>
            <div class="card-body">
                <div id="processingMessage" class="alert alert-info d-none">
                    <div class="spinner-border spinner-border-sm" role="status"></div>
                    編集処理中...
                </div>
                <div id="resultContainer" class="d-none">
                    <h6>編集後の動画:</h6>
                    <video id="resultVideo" controls class="img-fluid"></video>
                    <div class="d-grid gap-2 mt-3">
                        <a id="downloadLink" class="btn btn-success" download>編集済み動画をダウンロード</a>
                    </div>
                </div>
                <div id="noResultMessage" class="alert alert-info">
                    編集を適用すると結果がここに表示されます。
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/edit/voice-edit.js"></script>
</body>
</html>
