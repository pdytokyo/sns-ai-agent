<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS AIエージェント - 強化版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 10px 10px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border: none;
        }
        .btn-success {
            background: linear-gradient(135deg, #11cb6a 0%, #25fc94 100%);
            border: none;
        }
        .btn-info {
            background: linear-gradient(135deg, #11b5cb 0%, #25c8fc 100%);
            border: none;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header text-center">
        <h1>SNS AIエージェント</h1>
        <p class="lead">データドリブンなSNSコンテンツ生成システム</p>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">クライアント情報</h5>
                    </div>
                    <div class="card-body">
                        <form id="clientForm">
                            <div class="mb-3">
                                <label for="clientName" class="form-label">クライアント名</label>
                                <input type="text" class="form-control" id="clientName" required>
                            </div>
                            <div class="mb-3">
                                <label for="clientEmail" class="form-label">メールアドレス</label>
                                <input type="email" class="form-control" id="clientEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="youtubeUrls" class="form-label">YouTube URL（複数可、1行に1つ）</label>
                                <textarea class="form-control" id="youtubeUrls" rows="3" placeholder="https://www.youtube.com/watch?v=..."></textarea>
                                <small class="text-muted">参考にしたい動画のURLを入力してください。字幕を分析して台本生成に活用します。</small>
                            </div>
                            <button type="submit" class="btn btn-primary">保存</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">ターゲット・目的・プラットフォーム選択</h5>
                    </div>
                    <div class="card-body">
                        <form id="selectionForm">
                            <div class="mb-3">
                                <label class="form-label">ターゲット属性（複数選択可）</label>
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-check">
                                            <input class="form-check-input target-attr" type="checkbox" value="10代" id="target1">
                                            <label class="form-check-label" for="target1">10代</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input target-attr" type="checkbox" value="20代" id="target2">
                                            <label class="form-check-label" for="target2">20代</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check">
                                            <input class="form-check-input target-attr" type="checkbox" value="30代" id="target3">
                                            <label class="form-check-label" for="target3">30代</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input target-attr" type="checkbox" value="40代以上" id="target4">
                                            <label class="form-check-label" for="target4">40代以上</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check">
                                            <input class="form-check-input target-attr" type="checkbox" value="男性" id="target5">
                                            <label class="form-check-label" for="target5">男性</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input target-attr" type="checkbox" value="女性" id="target6">
                                            <label class="form-check-label" for="target6">女性</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">運用目的（複数選択可）</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input purpose" type="checkbox" value="ブランディング" id="purpose1">
                                            <label class="form-check-label" for="purpose1">ブランディング</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input purpose" type="checkbox" value="集客" id="purpose2">
                                            <label class="form-check-label" for="purpose2">集客</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input purpose" type="checkbox" value="商品販売" id="purpose3">
                                            <label class="form-check-label" for="purpose3">商品販売</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input purpose" type="checkbox" value="認知拡大" id="purpose4">
                                            <label class="form-check-label" for="purpose4">認知拡大</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">プラットフォーム（複数選択可）</label>
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-check">
                                            <input class="form-check-input platform" type="checkbox" value="YouTube" id="platform1">
                                            <label class="form-check-label" for="platform1">YouTube</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check">
                                            <input class="form-check-input platform" type="checkbox" value="Instagram" id="platform2">
                                            <label class="form-check-label" for="platform2">Instagram</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check">
                                            <input class="form-check-input platform" type="checkbox" value="TikTok" id="platform3">
                                            <label class="form-check-label" for="platform3">TikTok</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">保存</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">ファイルアップロード</h5>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label for="videoFile" class="form-label">動画ファイル</label>
                                <input class="form-control" type="file" id="videoFile" accept="video/*">
                            </div>
                            <div class="mb-3">
                                <label for="textFile" class="form-label">テキストファイル</label>
                                <input class="form-control" type="file" id="textFile" accept=".txt,.doc,.docx">
                            </div>
                            <div class="mb-3">
                                <label for="pdfFile" class="form-label">PDFファイル</label>
                                <input class="form-control" type="file" id="pdfFile" accept=".pdf">
                            </div>
                            <button type="submit" class="btn btn-primary">アップロード</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">AIプロフィール・台本生成</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <button id="generateProfileBtn" class="btn btn-primary me-2">プロフィール生成</button>
                            <button id="generateScriptBtn" class="btn btn-success">台本生成</button>
                        </div>
                        <div id="generatedContent" class="mt-3">
                            <div class="alert alert-info">
                                クライアント情報を入力し、ターゲット・目的・プラットフォームを選択してから生成ボタンをクリックしてください。
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">著作権フリーBGM選択</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="audioGenre" class="form-label">ジャンル</label>
                                <select class="form-select" id="audioGenre">
                                    <option value="">すべて</option>
                                    <option value="ポップ">ポップ</option>
                                    <option value="ロック">ロック</option>
                                    <option value="エレクトロニック">エレクトロニック</option>
                                    <option value="ヒップホップ">ヒップホップ</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="audioMood" class="form-label">ムード</label>
                                <select class="form-select" id="audioMood">
                                    <option value="">すべて</option>
                                    <option value="明るい">明るい</option>
                                    <option value="落ち着いた">落ち着いた</option>
                                    <option value="エネルギッシュ">エネルギッシュ</option>
                                    <option value="感動的">感動的</option>
                                </select>
                            </div>
                        </div>
                        <button id="searchAudioBtn" class="btn btn-primary mb-3">BGMを検索</button>
                        <div id="audioList" class="mt-3">
                            <div class="alert alert-info">
                                ジャンルとムードを選択して検索ボタンをクリックしてください。
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">動画編集</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="videoSelect" class="form-label">編集する動画を選択</label>
                            <select class="form-select" id="videoSelect">
                                <option value="">動画を選択してください</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">アスペクト比</label>
                            <div class="btn-group" role="group">
                                <input type="radio" class="btn-check" name="aspectRatio" id="ratio169" value="16:9" checked>
                                <label class="btn btn-outline-primary" for="ratio169">16:9</label>
                                
                                <input type="radio" class="btn-check" name="aspectRatio" id="ratio11" value="1:1">
                                <label class="btn btn-outline-primary" for="ratio11">1:1</label>
                                
                                <input type="radio" class="btn-check" name="aspectRatio" id="ratio916" value="9:16">
                                <label class="btn btn-outline-primary" for="ratio916">9:16</label>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="silenceThreshold" class="form-label">無音検出閾値: <span id="silenceThresholdValue">0.02</span></label>
                            <input type="range" class="form-range" id="silenceThreshold" min="0.01" max="0.1" step="0.01" value="0.02">
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="startMargin" class="form-label">開始マージン: <span id="startMarginValue">0.5</span>秒</label>
                                <input type="range" class="form-range" id="startMargin" min="0" max="2" step="0.1" value="0.5">
                            </div>
                            <div class="col-md-6">
                                <label for="endMargin" class="form-label">終了マージン: <span id="endMarginValue">0.5</span>秒</label>
                                <input type="range" class="form-range" id="endMargin" min="0" max="2" step="0.1" value="0.5">
                            </div>
                        </div>
                        
                        <button id="processVideoBtn" class="btn btn-primary">動画を処理</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // クライアントIDを保存する変数
        let clientId = null;
        
        // クライアント情報フォームの送信
        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('clientName').value;
            const email = document.getElementById('clientEmail').value;
            const youtubeUrls = document.getElementById('youtubeUrls').value.split('\n').filter(url => url.trim() !== '');
            
            fetch('/clients/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    youtube_urls: youtubeUrls
                }),
            })
            .then(response => response.json())
            .then(data => {
                clientId = data.id;
                alert('クライアント情報が保存されました。');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // ターゲット・目的・プラットフォーム選択フォームの送信
        document.getElementById('selectionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const targetAttributes = Array.from(document.querySelectorAll('.target-attr:checked')).map(cb => cb.value);
            const operationalPurposes = Array.from(document.querySelectorAll('.purpose:checked')).map(cb => cb.value);
            const platforms = Array.from(document.querySelectorAll('.platform:checked')).map(cb => cb.value);
            
            fetch('/selections/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    client_id: clientId,
                    target_attributes: targetAttributes,
                    operational_purposes: operationalPurposes,
                    platforms: platforms
                }),
            })
            .then(response => response.json())
            .then(data => {
                alert('選択情報が保存されました。');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // ファイルアップロードフォームの送信
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const formData = new FormData();
            formData.append('client_id', clientId);
            
            const videoFile = document.getElementById('videoFile').files[0];
            const textFile = document.getElementById('textFile').files[0];
            const pdfFile = document.getElementById('pdfFile').files[0];
            
            if (videoFile) formData.append('video_file', videoFile);
            if (textFile) formData.append('text_file', textFile);
            if (pdfFile) formData.append('pdf_file', pdfFile);
            
            fetch('/upload/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                alert('ファイルがアップロードされました。');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // プロフィール生成ボタンのクリック
        document.getElementById('generateProfileBtn').addEventListener('click', function() {
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const formData = new FormData();
            formData.append('client_id', clientId);
            
            fetch('/generate-profile/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                const content = `
                <div class="card mb-3">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">生成されたプロフィール</h5>
                    </div>
                    <div class="card-body">
                        <h6>アカウント名</h6>
                        <p>${data.account_name}</p>
                        <h6>プロフィール文</h6>
                        <p>${data.profile_text}</p>
                    </div>
                </div>
                `;
                
                document.getElementById('generatedContent').innerHTML = content;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // 台本生成ボタンのクリック
        document.getElementById('generateScriptBtn').addEventListener('click', function() {
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const formData = new FormData();
            formData.append('client_id', clientId);
            
            fetch('/generate-script/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                const content = `
                <div class="card mb-3">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">生成された台本</h5>
                    </div>
                    <div class="card-body">
                        <pre>${data.script_text}</pre>
                    </div>
                </div>
                `;
                
                document.getElementById('generatedContent').innerHTML = content;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // BGM検索ボタンのクリック
        document.getElementById('searchAudioBtn').addEventListener('click', function() {
            const genre = document.getElementById('audioGenre').value;
            const mood = document.getElementById('audioMood').value;
            
            fetch(`/copyright-free-audio/?genre=${genre}&mood=${mood}`)
            .then(response => response.json())
            .then(data => {
                let content = '';
                
                if (data.length === 0) {
                    content = '<div class="alert alert-warning">該当するBGMが見つかりませんでした。</div>';
                } else {
                    content = '<div class="list-group">';
                    data.forEach(audio => {
                        content += `
                        <div class="list-group-item">
                            <h6>${audio.title}</h6>
                            <p>ジャンル: ${audio.genre} | ムード: ${audio.mood} | 長さ: ${audio.duration}秒</p>
                            <audio controls src="/audio/${audio.id}" class="w-100"></audio>
                        </div>
                        `;
                    });
                    content += '</div>';
                }
                
                document.getElementById('audioList').innerHTML = content;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
        
        // スライダーの値表示更新
        document.getElementById('silenceThreshold').addEventListener('input', function() {
            document.getElementById('silenceThresholdValue').textContent = this.value;
        });
        
        document.getElementById('startMargin').addEventListener('input', function() {
            document.getElementById('startMarginValue').textContent = this.value;
        });
        
        document.getElementById('endMargin').addEventListener('input', function() {
            document.getElementById('endMarginValue').textContent = this.value;
        });
        
        // 動画処理ボタンのクリック
        document.getElementById('processVideoBtn').addEventListener('click', function() {
            if (!clientId) {
                alert('先にクライアント情報を保存してください。');
                return;
            }
            
            const videoId = document.getElementById('videoSelect').value;
            if (!videoId) {
                alert('動画を選択してください。');
                return;
            }
            
            const aspectRatio = document.querySelector('input[name="aspectRatio"]:checked').value;
            const silenceThreshold = document.getElementById('silenceThreshold').value;
            const startMargin = document.getElementById('startMargin').value;
            const endMargin = document.getElementById('endMargin').value;
            
            const formData = new FormData();
            formData.append('client_id', clientId);
            formData.append('file_id', videoId);
            formData.append('aspect_ratio', aspectRatio);
            formData.append('silence_threshold', silenceThreshold);
            formData.append('start_margin', startMargin);
            formData.append('end_margin', endMargin);
            
            fetch('/process-video/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                alert(`動画処理が完了しました。\n元の長さ: ${data.original_duration}秒\n処理後の長さ: ${data.processed_duration}秒\n削減率: ${data.reduction_percentage}%`);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました。');
            });
        });
    </script>
</body>
</html>
