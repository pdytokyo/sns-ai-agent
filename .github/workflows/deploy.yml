name: Deploy to EC2

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - run: python -m pip check
      - run: pytest -q

  build:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}
      - id: tag
        run: echo "TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ env.TAG }}
          provenance: false
      - uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/admin:${{ env.TAG }}
          provenance: false
      - uses: docker/build-push-action@v5
        with:
          context: ./bots
          file: ./bots/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/discordbot:${{ env.TAG }}
          provenance: false

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: set-tag
        run: echo "DEPLOY_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host:         ${{ secrets.EC2_HOST }}
          port:         ${{ secrets.EC2_PORT }}
          username:     ${{ secrets.EC2_USER }}
          key:          ${{ secrets.EC2_KEY }}          # PEM そのまま
          key_is_b64:   false                          # ← ここがポイント
          known_hosts:  ${{ secrets.EC2_KNOWN_HOST }}  # ssh-keyscan の 1 行
          envs:         DEPLOY_TAG
          script: |
            set -e
            cd /opt/sns-ai-agent
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            TAG=$DEPLOY_TAG docker compose -f docker-compose.prod.yml pull backend admin discordbot
            TAG=$DEPLOY_TAG docker compose -f docker-compose.prod.yml up -d

      - name: Health-check
        run: |
          echo "Waiting 30 s …"; sleep 30
          curl -f http://52.69.83.83:8000/health
