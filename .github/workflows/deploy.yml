name: Deploy to EC2

on:
  push:
    branches: [main]
    tags:    ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues:   write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          python -m pip check

      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - id: tag
        run: |
          # Sanitize tag by replacing slashes with hyphens
          TAG="${{ github.ref_name }}"
          TAG=${TAG//\//-}
          echo "TAG=$TAG" >> $GITHUB_ENV

      - uses: docker/build-push-action@v5
        with:
          context:   ./backend
          file:      ./backend/Dockerfile
          push:      true
          tags:      ghcr.io/${{ github.repository }}/backend:${{ env.TAG }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: false

      - uses: docker/build-push-action@v5
        with:
          context:   ./admin
          file:      ./admin/Dockerfile
          push:      true
          tags:      ghcr.io/${{ github.repository }}/admin:${{ env.TAG }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: false

      - uses: docker/build-push-action@v5
        with:
          context:   ./bots
          file:      ./bots/Dockerfile
          push:      true
          tags:      ghcr.io/${{ github.repository }}/discordbot:${{ env.TAG }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: set_tag
        run: echo "DEPLOY_TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          port:     ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_KEY }}
          envs:     DEPLOY_TAG
          script: |
            set -e
            cd /opt/sns-ai-agent
            docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} -p ${{ secrets.GHCR_PAT }}
            # More aggressive cleanup to free disk space
            docker system prune -af
            docker volume prune -f
            docker image prune -af
            # Remove all unused images
            docker rmi $(docker images -q) || true
            TAG=${DEPLOY_TAG//\//-}
            export TAG
            docker compose -f docker-compose.prod.yml pull backend admin discordbot
            docker compose -f docker-compose.prod.yml up -d

      - name: Health-check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "Retrying health check ..."
            for i in {1..20}; do
              if curl -sf http://localhost:8000/health; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "❌ attempt $i/20 failed — waiting 10s"
              sleep 10
            done
            echo "Health check failed after 200s"
            exit 1
