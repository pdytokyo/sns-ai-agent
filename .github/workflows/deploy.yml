name: Deploy to EC2

on:
  push:
    branches: [main]
    tags:    ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues:   write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          python -m pip check

      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - id: tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - uses: docker/build-push-action@v5
        with:
          context:   ./backend
          file:      ./backend/Dockerfile
          push:      true
          tags:      ghcr.io/${{ github.repository }}-backend:${{ env.TAG }}
          provenance: false

      - uses: docker/build-push-action@v5
        with:
          context:   ./admin
          file:      ./admin/Dockerfile
          push:      true
          tags:      ghcr.io/${{ github.repository }}-admin:${{ env.TAG }}
          provenance: false

      - uses: docker/build-push-action@v5
        with:
          context:   ./bots
          file:      ./bots/Dockerfile
          push:      true
          tags:      ghcr.io/${{ github.repository }}-discordbot:${{ env.TAG }}
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    steps:
      - id: set_tag
        run: echo "DEPLOY_TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          port:     ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_KEY }}   # PEM そのまま
          envs:     DEPLOY_TAG,GHCR_PAT
          script: |
            set -e
            cd /opt/sns-ai-agent
            echo $GHCR_PAT | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            TAG=$DEPLOY_TAG docker compose -f docker-compose.prod.yml pull backend admin discordbot
            TAG=$DEPLOY_TAG docker compose -f docker-compose.prod.yml up -d

      - name: Health-check
        run: |
          echo "Waiting 30 s …"
          sleep 30
          curl -f http://${{ secrets.EC2_HOST }}:8000/health
