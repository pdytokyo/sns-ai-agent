name: Deploy to EC2

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          python -m pip check
          
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Test with pytest
        run: |
          pytest -q
          
      - name: Initialize database
        run: |
          python init_database.py
          
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            pytest-logs.xml
            .pytest_cache/

  build:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    
    env:
      REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:latest
          
      - name: Build and push admin image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: true
          tags: ghcr.io/${{ github.repository }}-admin:latest
          
      - name: Build and push discordbot image
        uses: docker/build-push-action@v5
        with:
          context: ./bots
          push: true
          tags: ghcr.io/${{ github.repository }}-discordbot:latest

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set deployment tag
        id: set-tag
        run: |
          if [[ "${{ github.ref_name }}" == *"/"* ]]; then
            echo "DEPLOY_TAG=pr-$(echo ${{ github.ref_name }} | cut -d'/' -f1)" >> $GITHUB_ENV
          else
            echo "DEPLOY_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
          echo "Using tag: ${{ env.DEPLOY_TAG }}"
      
      - name: Deploy to EC2
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            
            # Login to GitHub Container Registry
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            
            # Clean up old Docker images
            docker system prune -af --volumes --filter "until=24h" || true
            
            # Deploy the application
            cd /opt/sns-ai-agent
            
            # Set the TAG environment variable for docker-compose
            export TAG=${{ env.DEPLOY_TAG }}
            
            # Pull the latest images
            docker compose pull backend admin discordbot
            
            # Start the containers using production compose file
            docker compose -f docker-compose.prod.yml up -d
      
      - name: Health Check
        id: health_check
        run: |
          set -e
          
          # Create log file for health check
          mkdir -p logs
          HEALTH_LOG="logs/health-$(date +%Y%m%d-%H%M%S).log"
          
          # Wait for services to start
          echo "Waiting 30 seconds for services to start..." | tee -a "$HEALTH_LOG"
          sleep 30
          
          # Check backend health
          echo "Checking backend health..." | tee -a "$HEALTH_LOG"
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:8000/health)
          echo "Health status: $HEALTH_STATUS" | tee -a "$HEALTH_LOG"
          
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "Health check failed with status $HEALTH_STATUS" | tee -a "$HEALTH_LOG"
            exit 1
          else
            echo "Health check passed with status $HEALTH_STATUS" | tee -a "$HEALTH_LOG"
          fi
      
      - name: Check Container Status
        id: container_check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            
            cd /opt/sns-ai-agent
            echo "Checking container status..."
            CONTAINER_STATUS=$(docker compose ps --format json)
            echo "$CONTAINER_STATUS"
            
            # Check if all containers are running
            if ! echo "$CONTAINER_STATUS" | grep -q '"State":"running"'; then
              echo "Container check failed: Not all containers are running"
              exit 1
            else
              echo "Container check passed: All containers are running"
            fi
      
      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: logs/
