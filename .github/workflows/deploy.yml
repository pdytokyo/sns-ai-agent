name: Deploy to EC2

on:
  push:
    branches: [main]
    tags:    ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues:   write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          python -m pip check

      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set tag
        id: tag
        run: |
          echo "DEBUG TAG=${{ github.ref_name }}" 
          # Sanitize tag by replacing slashes with hyphens
          TAG="${{ github.ref_name }}"
          TAG=${TAG//\//-}
          echo "TAG=$TAG" >> $GITHUB_ENV

      - uses: docker/build-push-action@v5
        with:
          context:   ./backend
          file:      ./backend/Dockerfile
          push:      true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ env.TAG }}
          provenance: false

      - uses: docker/build-push-action@v5
        with:
          context:   ./admin
          file:      ./admin/Dockerfile
          push:      true
          tags: |
            ghcr.io/${{ github.repository }}/admin:${{ github.sha }}
            ghcr.io/${{ github.repository }}/admin:${{ env.TAG }}
          provenance: false

      - uses: docker/build-push-action@v5
        with:
          context:   ./bots
          file:      ./bots/Dockerfile
          push:      true
          tags: |
            ghcr.io/${{ github.repository }}/discordbot:${{ github.sha }}
            ghcr.io/${{ github.repository }}/discordbot:${{ env.TAG }}
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: set_tag
        run: |
          echo "DEBUG TAG=${{ github.ref_name }}"
          # Sanitize tag by replacing slashes with hyphens
          TAG="${{ github.ref_name }}"
          TAG=${TAG//\//-}
          echo "DEPLOY_TAG=$TAG" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          port:     ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_KEY }}   # PEM そのまま
          envs:     DEPLOY_TAG
          script: |
            set -ex
            cd /opt/sns-ai-agent
            echo "RAW TAG=$DEPLOY_TAG"
            TAG=${DEPLOY_TAG//\//-}
            export TAG
            docker --version
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }} || exit 98
            docker pull ghcr.io/${{ github.repository }}/backend:$TAG || exit 99
            docker compose -f docker-compose.prod.yml pull backend admin discordbot || exit 100
            TAG=$TAG docker compose -f docker-compose.prod.yml up -d || exit 101

      - name: Health-check
        run: |
          echo "Waiting 60 s for services to start..."
          sleep 60
          echo "Checking backend health..."
          curl -v http://${{ secrets.EC2_HOST }}:8000/health || true
          echo "Checking container status..."
          curl -v http://${{ secrets.EC2_HOST }}:8000 || true
