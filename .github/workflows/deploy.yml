name: Deploy to EC2

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Add permissions for issue creation and package publishing
permissions:
  contents: read
  issues: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Check for unresolved dependencies
        run: |
          python -m pip check
      - name: Test with pytest
        run: |
          pytest -q
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            pytest-logs.xml
            .pytest_cache/

  build:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    # Only build if it's a push event or a PR from the same repo
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      HAS_GHCR_SECRETS: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_PAT != '' }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        # Only attempt login if secrets are available (typically not in PR builds from forks)
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && env.HAS_GHCR_SECRETS == 'true') }}
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        # Only attempt push if secrets are available
        if: ${{ github.event_name != 'pull_request' || env.HAS_GHCR_SECRETS == 'true' }}
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Only push if not a PR and secrets are available
          push: ${{ github.event_name != 'pull_request' && env.HAS_GHCR_SECRETS == 'true' }}
          # Only add tags if pushing
          tags: ${{ github.event_name != 'pull_request' && env.HAS_GHCR_SECRETS == 'true' && format('ghcr.io/{0}/backend:{1},ghcr.io/{0}/backend:{2}', github.repository, github.sha, github.ref_name) || '' }}
          provenance: false
      
      - name: Build and push admin image
        uses: docker/build-push-action@v5
        # Only attempt push if secrets are available
        if: ${{ github.event_name != 'pull_request' || env.HAS_GHCR_SECRETS == 'true' }}
        with:
          context: ./admin
          file: ./admin/Dockerfile
          # Only push if not a PR and secrets are available
          push: ${{ github.event_name != 'pull_request' && env.HAS_GHCR_SECRETS == 'true' }}
          # Only add tags if pushing
          tags: ${{ github.event_name != 'pull_request' && env.HAS_GHCR_SECRETS == 'true' && format('ghcr.io/{0}/admin:{1},ghcr.io/{0}/admin:{2}', github.repository, github.sha, github.ref_name) || '' }}
          provenance: false
      
      - name: Build and push discordbot image
        uses: docker/build-push-action@v5
        # Only attempt push if secrets are available
        if: ${{ github.event_name != 'pull_request' || env.HAS_GHCR_SECRETS == 'true' }}
        with:
          context: ./bots
          file: ./bots/Dockerfile
          # Only push if not a PR and secrets are available
          push: ${{ github.event_name != 'pull_request' && env.HAS_GHCR_SECRETS == 'true' }}
          # Only add tags if pushing
          tags: ${{ github.event_name != 'pull_request' && env.HAS_GHCR_SECRETS == 'true' && format('ghcr.io/{0}/discordbot:{1},ghcr.io/{0}/discordbot:{2}', github.repository, github.sha, github.ref_name) || '' }}
          provenance: false

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    # Only deploy if build was successful and it's a push event or a PR from the same repo
    if: ${{ needs.build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    env:
      HAS_GHCR_SECRETS: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_PAT != '' }}
    steps:
      - name: Deploy to EC2
        id: deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host:        ${{ secrets.EC2_HOST }}
          port:        ${{ secrets.EC2_PORT }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_KEY }}        # base64-encoded
          key_is_b64:  true
          known_hosts: ${{ secrets.EC2_KNOWN_HOST }} # from ssh-keyscan
          envs: DEPLOY_TAG
          script: |
            set -e
            cd /opt/sns-ai-agent
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            export TAG=${{ github.ref_name }}
            docker compose pull backend admin discordbot
            docker compose -f docker-compose.prod.yml up -d
      
      - name: Health Check
        id: health_check
        run: |
          # Create log file for health check
          mkdir -p logs
          HEALTH_LOG="logs/health-$(date +%Y%m%d-%H%M%S).log"
          
          # Wait for services to start
          echo "Waiting 30 seconds for services to start..." | tee -a "$HEALTH_LOG"
          sleep 30
          
          # Check backend health
          echo "Checking backend health..." | tee -a "$HEALTH_LOG"
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST || '52.69.83.83' }}:8000/health)
          echo "Health status: $HEALTH_STATUS" | tee -a "$HEALTH_LOG"
          
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "Health check failed with status $HEALTH_STATUS" | tee -a "$HEALTH_LOG"
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "log_file=$HEALTH_LOG" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "Health check passed with status $HEALTH_STATUS" | tee -a "$HEALTH_LOG"
            echo "status=success" >> $GITHUB_OUTPUT
          fi
          
      - name: Check Docker Container Status
        id: container_check
        uses: appleboy/ssh-action@v0.1.7
        with:
          host:        ${{ secrets.EC2_HOST }}
          port:        ${{ secrets.EC2_PORT }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_KEY }}        # base64-encoded
          key_is_b64:  true
          known_hosts: ${{ secrets.EC2_KNOWN_HOST }} # from ssh-keyscan
          script: |
            cd /opt/sns-ai-agent
            echo "Checking container status..."
            CONTAINER_STATUS=$(docker compose ps --format json)
            echo "$CONTAINER_STATUS"
            
            # Check if all containers are running
            if ! echo "$CONTAINER_STATUS" | grep -q '"State":"running"'; then
              echo "Container check failed: Not all containers are running"
              exit 1
            else
              echo "Container check passed: All containers are running"
            fi
      
      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: logs/
      
      - name: Create issue for deployment failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Determine which step failed
            const deployFailed = "${{ steps.deploy.outputs.status }}" === "failed";
            const healthCheckFailed = "${{ steps.health_check.outputs.status }}" === "failed";
            
            // Get log file path
            const logFile = deployFailed 
              ? "${{ steps.deploy.outputs.log_file }}"
              : "${{ steps.health_check.outputs.log_file }}";
            
            // Read log file if it exists
            let logContent = '';
            try {
              if (logFile) {
                logContent = fs.readFileSync(logFile, 'utf8');
                // Truncate if too long
                if (logContent.length > 5000) {
                  logContent = logContent.substring(0, 5000) + '... (truncated)';
                }
              }
            } catch (error) {
              console.error(`Error reading log file: ${error}`);
            }
            
            // Create issue title based on failure type
            const title = deployFailed
              ? '🚨 Deployment to EC2 failed'
              : '🚨 Health check failed after deployment';
            
            // Create issue body
            const body = `
            ## Deployment Failure Report
            
            A deployment to EC2 has failed in the [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow.
            
            ### Failure Details
            - **Commit**: [${context.sha.substring(0, 7)}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})
            - **Workflow Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            - **Failed Step**: ${deployFailed ? 'Deployment to EC2' : 'Health Check'}
            
            ### Error Logs
            \`\`\`
            ${logContent}
            \`\`\`
            
            @devin-ai-integration please investigate this issue and create a PR with fixes.
            `;
            
            // Create the issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'deployment', 'automated']
            });
            
            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
